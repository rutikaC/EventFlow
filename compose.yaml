services:
  backend:
   build: ./server
   container_name: eventflow-backend-container
   ports:
    - "5000:5000"
   env_file:
    - ./server/.env
   restart: unless-stopped

  frontend:
    build: ./client
    container_name: eventflow-frontend-container
    ports: 
     - "5173:5173"
    depends_on:
     - backend
    restart: unless-stopped